<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64">
  <rect width="420" height="64" rx="10" fill="#0A1628" stroke="#00D4FF" stroke-opacity="0.45"/>
  <g transform="translate(30 12)" fill="#00D4FF">
    <!-- equalizer bars -->
    <rect x="0" y="20" width="6" height="20" rx="2">
      <animate attributeName="height" values="10;36;14;28;10" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;4;18;10;20" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="14" y="12" width="6" height="28" rx="2">
      <animate attributeName="height" values="18;40;12;32;18" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;0;22;8;16" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="28" y="8" width="6" height="32" rx="2">
      <animate attributeName="height" values="24;40;16;36;24" dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;0;18;4;12" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <rect x="42" y="16" width="6" height="24" rx="2">
      <animate attributeName="height" values="12;34;18;30;12" dur="0.85s" repeatCount="indefinite"/>
      <animate attributeName="y" values="18;4;16;8;18" dur="0.85s" repeatCount="indefinite"/>
    </rect>
    <rect x="56" y="14" width="6" height="26" rx="2">
      <animate attributeName="height" values="16;38;12;28;16" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="16;2;20;10;16" dur="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="70" y="18" width="6" height="22" rx="2">
      <animate attributeName="height" values="10;30;16;26;10" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="20;6;16;10;20" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="120" y="28" fill="#7FDBFF" font-family="Consolas, monospace" font-size="11">VOICE CHANNEL</text>
  <text x="120" y="46" fill="#FFFFFF" font-family="Consolas, monospace" font-size="13">Listening for directives&</text>
  <circle cx="390" cy="32" r="5" fill="#00FF88">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
</svg>
