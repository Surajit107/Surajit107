<svg xmlns="http://www.w3.org/2000/svg" width="480" height="56" viewBox="0 0 480 56" role="img" aria-label="Voice channel">
  <rect width="480" height="56" rx="8" fill="#0D1117" stroke="#3A2A12" stroke-width="1"/>
  <g transform="translate(24 14)" fill="#F5A623">
    <rect x="0" width="3" rx="1" height="16" y="8">
      <animate attributeName="height" values="10;22;12;18;10" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="11;1;10;5;11" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="9" width="3" rx="1" height="20" y="6">
      <animate attributeName="height" values="14;26;12;20;14" dur="1.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="9;0;11;6;9" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="18" width="3" rx="1" height="24" y="4">
      <animate attributeName="height" values="16;28;14;22;16" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="8;0;10;4;8" dur="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="27" width="3" rx="1" height="18" y="7">
      <animate attributeName="height" values="12;24;14;20;12" dur="1.7s" repeatCount="indefinite"/>
      <animate attributeName="y" values="10;2;9;5;10" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="36" width="3" rx="1" height="14" y="9">
      <animate attributeName="height" values="8;20;12;16;8" dur="1.55s" repeatCount="indefinite"/>
      <animate attributeName="y" values="12;4;10;7;12" dur="1.55s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="86" y="24" fill="#8A7A5A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">VOICE CHANNEL</text>
  <text x="86" y="40" fill="#E8C87A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Listening for directives</text>
  <circle cx="448" cy="28" r="3.5" fill="#F5A623">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
