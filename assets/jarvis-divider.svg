  <rect x="472" y="34" width="270" height="2" fill="#1F6B7A"/>
  <rect x="721" y="16" width="3" height="24" fill="#7FDBFF"/>

  <!-- right bracket -->
  <polygon points="766,18 750,28 766,38" fill="#7FDBFF"/>
  <rect x="790" y="14" width="6" height="28" fill="#00D4FF"/>
  <rect x="774" y="14" width="22" height="4" fill="#00D4FF"/>
  <rect x="774" y="38" width="22" height="4" fill="#00D4FF"/>

  <text x="78" y="50" fill="#3D8FA0" font-family="Consolas, Monaco, monospace" font-size="9" letter-spacing="3">MODULE</text>
  <text x="742" y="50" fill="#3D8FA0" font-family="Consolas, Monaco, monospace" font-size="9" letter-spacing="3" text-anchor="end">BOUNDARY</text>
</svg>
