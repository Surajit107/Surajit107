<svg xmlns="http://www.w3.org/2000/svg" width="820" height="56" viewBox="0 0 820 56">
  <!-- Filled shapes only — GitHub Camo drops thin strokes to invisible dots -->

  <!-- left bracket -->
  <rect x="24" y="14" width="6" height="28" fill="#00D4FF"/>
  <rect x="24" y="14" width="22" height="4" fill="#00D4FF"/>
  <rect x="24" y="38" width="22" height="4" fill="#00D4FF"/>
  <polygon points="54,18 70,28 54,38" fill="#7FDBFF"/>

  <!-- left rail -->
  <rect x="78" y="20" width="270" height="2" fill="#1F6B7A"/>
  <rect x="78" y="25" width="270" height="6" fill="#00D4FF"/>
  <rect x="78" y="34" width="270" height="2" fill="#1F6B7A"/>
  <rect x="96" y="16" width="3" height="24" fill="#7FDBFF"/>

  <!-- center hub (border via layered fills, no stroke) -->
  <rect x="366" y="8" width="88" height="40" rx="4" fill="#00D4FF"/>
  <rect x="370" y="12" width="80" height="32" rx="3" fill="#0A1628"/>
  <polygon points="410,16 424,28 410,40 396,28" fill="#00D4FF"/>
  <rect x="406" y="24" width="8" height="8" fill="#050B14"/>

  <!-- right rail -->
  <rect x="472" y="20" width="270" height="2" fill="#1F6B7A"/>
